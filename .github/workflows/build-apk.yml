name: Build BienBaoAI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bien_bao_final/BienBaoAI/2_app_dien_thoai/bien_bao_ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Ghim phiên bản để lần build sau không tự đổi sang Flutter mới hơn
          flutter-version: 3.24.5
          cache: true

      # Tạo thư mục android/ TRƯỚC khi lấy package
      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.bienbao .
          fi

      # Bước bị thiếu: nâng minSdk lên 26 (tflite_flutter cần), bật proguard, đổi tên app
      - name: Patch Android config
        run: bash ci/patch_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BienBaoAI-Android-APK
          path: bien_bao_final/BienBaoAI/2_app_dien_thoai/bien_bao_ai/build/app/outputs/flutter-apk/app-release.apk
